name: Render Keep Alive

on:
  schedule:
    # Runs every 10 minutes to stop the Render free-tier service from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it manually from the GitHub Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://my-programs-dra1.onrender.com/health"
